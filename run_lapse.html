<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b2d">
<title>AL MUSTAQBAL PS4 - Lapse Chain</title>
<link rel="stylesheet" href="style.css">
<style>
body.run-page{background:radial-gradient(780px 420px at 75% 8%,rgba(0,166,255,.16),transparent 62%),linear-gradient(180deg,#031526 0%,#020c16 100%)}
.run-page .topbar{height:78px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.run-page .brand{display:flex;align-items:center;gap:12px}
.run-page .brand-logo{width:54px;height:54px;border-radius:12px;background:#fff url('almustaqbal.jpg') center/contain no-repeat;box-shadow:0 0 24px rgba(0,190,255,.22)}
.run-page .brand-text{display:flex;flex-direction:column}.run-page .brand-name{font-family:Georgia,serif;font-size:19px;font-weight:900;color:#fff}.run-page .brand-sub{font-size:10px;color:#62d4ff;margin-top:3px}
.run-page .wrap{max-width:1100px;margin:0 auto;padding:28px 18px}
.run-page .hero{min-height:230px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:30px 34px;border:1px solid rgba(72,190,238,.18);border-radius:22px;background:linear-gradient(135deg,rgba(5,33,55,.95),rgba(3,20,35,.94));box-shadow:0 24px 60px rgba(0,0,0,.24)}
.run-page .hero-title{font-size:46px;line-height:1;margin:0;color:#fff}.run-page .hero-title .accent{display:block;margin-top:6px;color:#32c8ff}.run-page .hero-sub{margin-top:12px;color:#b8d9e8;font-size:13px}
.run-page .status-panel{width:calc(100% - 40px);max-width:860px;margin:-24px auto 20px;padding:16px 18px;text-align:center;border:1px solid rgba(63,202,255,.4);border-radius:18px;background:linear-gradient(180deg,rgba(5,36,60,.98),rgba(3,22,39,.98));box-shadow:0 18px 40px rgba(0,0,0,.3)}
.run-page .status-text{font-size:15px;font-weight:800;color:#dff6ff}.run-page .status-text.error{color:#ff8b9c}.run-page .status-text.success{color:#61e8b8}.run-page .btn{margin-top:12px}
.run-page .foot{max-width:1100px;margin:0 auto 18px;padding:16px;border:1px solid rgba(70,191,240,.16);border-radius:18px;background:rgba(4,28,47,.92);text-align:center;line-height:1.8}.run-page .foot p{margin:0;color:#d9f4ff;font-size:12px}.run-page .foot strong{color:#53cdf7}.run-page .foot p:after{content:'  •  اليمن عدن شارع التسعين محطة المستقبل مقابل فندق دار التوحيد  •  776330635  •  770299356';color:#fff}
#out{display:none!important}
@media(max-width:700px){.run-page .topbar{height:68px;padding:0 12px}.run-page .brand-logo{width:46px;height:46px}.run-page .brand-name{font-size:15px}.run-page .brand-sub{font-size:8px}.run-page .badge{font-size:8px;padding:7px 10px}.run-page .wrap{padding:16px 10px}.run-page .hero{min-height:205px;padding:24px 20px}.run-page .hero-title{font-size:34px}.run-page .status-panel{width:92%;margin:-18px auto 16px}.run-page .foot p{font-size:10px}.run-page .foot p:after{display:block;margin-top:6px;content:'اليمن عدن شارع التسعين محطة المستقبل مقابل فندق دار التوحيد\A 776330635  •  770299356';white-space:pre-line}}
</style>
</head>
<body class="run-page">
<div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-logo" aria-label="AL MUSTAQBAL"></div>
            <div class="brand-text">
                <span class="brand-name">AL MUSTAQBAL</span>
                <span class="brand-sub">المستقبل • PS4 HOST</span>
            </div>
        </div>
        <div class="badge">Lapse Chain</div>
    </header>

    <main class="wrap">
        <section class="hero">
            <h1 class="hero-title">AL MUSTAQBAL <span class="accent">LAPSE</span></h1>
            <p class="hero-sub">المستقبل للهاتف • Firmware 11.00 - 12.02</p>
        </section>

        <section class="status-panel">
            <span id="state" class="status-text loading">⏳ Please wait...</span>
            <br>
            <button id="retry" class="btn hidden" type="button">↻ Retry</button>
        </section>
        <div id="out" style="display:none;"></div>
    </main>

    <footer class="foot"><p><strong>AL MUSTAQBAL PHONE • المستقبل للهاتف</strong></p></footer>
</div>

<script type="module">
    var started = false;
    function boot() {
        if (started) return;
        started = true;
        import("./chain_lapse.js").catch(function(e) {
            var stateEl = document.getElementById("state");
            stateEl.innerHTML = "❌ Failed: " + (e && e.message ? e.message : e);
            stateEl.className = "status-text error";
            var btn = document.getElementById("retry");
            if (btn) btn.className = "btn";
        });
    }
    function bootSettled() { setTimeout(boot, 1200); }
    var appCache = window.applicationCache;
    if (appCache) {
        appCache.addEventListener('cached', bootSettled, false);
        appCache.addEventListener('noupdate', bootSettled, false);
        appCache.addEventListener('error', bootSettled, false);
        appCache.addEventListener('obsolete', bootSettled, false);
        setTimeout(bootSettled, 6000);
    } else {
        bootSettled();
    }
    document.getElementById("retry").addEventListener("click", function() { location.reload(); }, false);
    window.addEventListener("error", function(e) {
        var stateEl = document.getElementById("state");
        if (stateEl && stateEl.textContent === "⏳ Please wait...") {
            stateEl.innerHTML = "❌ " + (e && e.message ? e.message : "Script error");
            stateEl.className = "status-text error";
        }
    }, false);
</script>
</body>
</html>
